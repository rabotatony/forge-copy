name: Deploy Forge to Cloudflare Containers
# Bootstrap: builds Forge Docker image and deploys to Cloudflare Containers.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "src/**"
      - "package.json"
      - "wrangler.containers.jsonc"
      - ".github/workflows/deploy-forge-container.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bunx prisma generate

      # Docker is pre-installed on ubuntu-latest runners.
      # wrangler deploy builds the Docker image and pushes it to
      # Cloudflare's container registry, then deploys the Worker+Container.
      - name: Deploy Forge to Cloudflare Containers
# Bootstrap: builds Forge Docker image and deploys to Cloudflare Containers.
        run: bunx wrangler deploy --config wrangler.containers.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
