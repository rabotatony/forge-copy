name: deai-audit

on:
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Audit changed files
        id: audit
        run: |
          BASE="${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "origin/$BASE" HEAD || true)
          : > rows.txt
          FAIL=0
          for f in $CHANGED; do
            case "$f" in
              *.md|*.txt|*.ts|*.tsx|*.js|*.jsx|*.css|*.scss)
                if [ -f "$f" ] && [ -f "scripts/deai-check.mjs" ]; then
                  OUT=$(node scripts/deai-check.mjs "$f" || true)
                  SCORE=$(printf '%s\n' "$OUT" | sed -n 's/^score: //p')
                  VERDICT=$(printf '%s\n' "$OUT" | sed -n 's/^verdict: //p')
                  SIGNALS=$(printf '%s\n' "$OUT" | sed -n 's/^signals: //p')
                  echo "| $f | ${SCORE:-0} | ${VERDICT:-n/a} | ${SIGNALS:-none} |" >> rows.txt
                  HIGH=$(node -e "console.log((parseFloat(process.argv[1]||'0')>=0.6)?1:0)" "$SCORE")
                  if [ "$HIGH" = "1" ]; then FAIL=1; fi
                fi
                ;;
            esac
          done
          {
            echo "## AI-pattern audit of changed files"
            echo ""
            echo "| File | Score | Verdict | Signals |"
            echo "|------|-------|---------|---------|"
            cat rows.txt
            echo ""
            echo "Score >= 0.6 fails; 0.4-0.6 warns. See AGENTS.md."
          } > audit-summary.md
          cat audit-summary.md
          echo "fail=$FAIL" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("audit-summary.md", "utf8");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Enforce threshold
        run: |
          if [ "${{ steps.audit.outputs.fail }}" = "1" ]; then
            echo "::error::A changed file scores >= 0.6 (clear AI patterns). Reduce them (see AGENTS.md)."
            exit 1
          fi
          echo "No file exceeds the 0.6 threshold."
