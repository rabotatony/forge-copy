name: Deploy Forge to Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: bun install
      - run: bunx prisma generate
      - run: bunx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/d1-init.sql
      - name: idempotent
        run: |
          sed -i -e 's/CREATE TABLE "/CREATE TABLE IF NOT EXISTS "/g' \
                 -e 's/CREATE INDEX "/CREATE INDEX IF NOT EXISTS "/g' \
                 -e 's/CREATE UNIQUE INDEX "/CREATE UNIQUE INDEX IF NOT EXISTS "/g' prisma/d1-init.sql
      - run: bunx wrangler d1 execute forge-db --file prisma/d1-init.sql --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: bunx opennextjs-cloudflare build
        env:
          DATABASE_URL: "file:./storage/forge.db"
          FORGE_BUILD_TARGET: cloudflare
          FORGE_ENCRYPTION_KEY: ${{ secrets.FORGE_ENCRYPTION_KEY }}
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORGE_ENCRYPTION_KEY: ${{ secrets.FORGE_ENCRYPTION_KEY }}
