name: Build Forge Image
# Builds Forge's OWN release image and publishes it to ghcr.io.
# This is ONLY a bootstrap to produce a deployable image for Sealos.
# It does NOT make Forge's CI engine depend on GitHub Actions.
on:
  push:
    branches: [main]
    paths: [Dockerfile, "src/**", "package.json", "bun.lock", ".github/workflows/build-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/rabotatony/forge:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
