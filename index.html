<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שושנה · טקס יומי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#120d09;--bg2:#1a130d;--ink:#e9dcc3;--dim:#a08c6a;--gold:#c9a227;--gold-soft:#8a6d1d;--line:rgba(201,162,39,.25)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:radial-gradient(1200px 600px at 50% -10%, #241a10 0%, var(--bg) 55%) fixed;color:var(--ink);font-family:"Assistant",system-ui,sans-serif;font-weight:300;overflow-x:hidden}
  .serif{font-family:"Frank Ruhl Libre",serif}
  .wrap{max-width:680px;margin:0 auto;padding:0 1.6rem}
  section{padding:9vh 0;text-align:center;opacity:0;transform:translateY(18px);transition:opacity .9s ease,transform .9s ease}
  section.on{opacity:1;transform:none}
  .orn{color:var(--gold-soft);letter-spacing:.6em;font-size:.8rem}
  .opening{min-height:78vh;display:flex;flex-direction:column;justify-content:center;gap:1.4rem}
  .opening .moon{font-size:2.6rem;color:var(--gold);text-shadow:0 0 24px rgba(201,162,39,.45)}
  .opening h1{font-size:clamp(1.6rem,4.5vw,2.6rem);font-weight:400;line-height:1.6}
  .opening .sub{color:var(--dim);font-size:1rem;letter-spacing:.12em}
  .card{margin:2.5rem auto 0;width:min(300px,80%);padding:2.6rem 1.6rem;border:1px solid var(--line);border-radius:14px;position:relative;background:linear-gradient(160deg,var(--bg2),#0e0a06);box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 0 40px rgba(201,162,39,.05)}
  .card:before{content:"";position:absolute;inset:8px;border:1px solid var(--line);border-radius:9px;pointer-events:none}
  .card .letter{font-size:4rem;color:var(--gold);font-weight:500}
  .card .name{font-size:1.7rem;margin:.8rem 0 .3rem;font-weight:500}
  .card .kw{color:var(--dim);letter-spacing:.4em;font-size:.8rem}
  .card .meaning{margin-top:1.4rem;font-size:1.02rem;line-height:1.95;opacity:.9}
  .whisper{font-size:clamp(1.2rem,3.4vw,1.6rem);line-height:2;font-style:italic;opacity:.92}
  .whisper:before,.whisper:after{content:"✦";display:block;color:var(--gold-soft);font-size:.8rem;margin:1.2rem 0}
  .cosmic{display:flex;justify-content:center;gap:3rem;flex-wrap:wrap}
  .cosmic .glyph{font-size:1.8rem;color:var(--gold)}
  .cosmic .label{color:var(--dim);font-size:.78rem;letter-spacing:.3em;margin:.5rem 0 .3rem}
  .cosmic .theme{font-size:.95rem;line-height:1.7;max-width:220px;margin:0 auto}
  .story h3{font-size:1.4rem;font-weight:500;margin-bottom:1.4rem;color:var(--gold)}
  .story p{font-size:1.05rem;line-height:2.1;text-align:right;opacity:.9}
  .story .teach{margin-top:1.6rem;text-align:center;font-style:italic;color:var(--dim)}
  .closing{padding:14vh 0 16vh}
  .closing p{color:var(--dim);letter-spacing:.2em;font-size:1rem}
  .divider{border:0;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:0 auto;max-width:420px}
</style>
</head>
<body>
<div class="wrap">
  <section class="opening"><div class="moon" id="moon">☾</div><h1 class="serif" id="opening"></h1><div class="sub" id="dateline"></div></section>
  <hr class="divider">
  <section><div class="orn">✦ ✧ </div><div class="card"><div class="letter serif" id="cardLetter"></div><div class="name serif" id="cardName"></div><div class="kw" id="cardKeyword"></div><div class="meaning" id="cardMeaning"></div></div></section>
  <hr class="divider">
  <section><p class="whisper serif" id="whisper"></p></section>
  <hr class="divider">
  <section class="cosmic"><div class="item"><div class="glyph" id="lunarGlyph">☾</div><div class="label">ירח</div><div class="theme" id="lunarTheme"></div></div><div class="item"><div class="glyph" id="seasonGlyph">✦</div><div class="label" id="seasonLabel">עונה</div><div class="theme" id="seasonTheme"></div></div></section>
  <hr class="divider">
  <section class="story"><h3 class="serif" id="storyTitle"></h3><p id="storyBody"></p><p class="teach" id="storyTeaching"></p></section>
  <hr class="divider">
  <section class="closing"><p id="closing"></p></section>
</div>
<script>
const CARDS=[{l:"א",n:"הקוסם",k:"רצון",m:"הכוח לפעול נמצא בך גם כשאינך מרגיש מוכן. צעד קטן אחד היום פותח את הדלת."},{l:"ו",n:"האוהבים",k:"בחירה",m:"כל בחירה אמיתית דורשת ויתור על משהו. בחר במה שחשוב לך באמת."},{l:"י",n:"גלגל המזל",k:"מחזור",m:"מה שיורד יעלה. לא הכל בשליטתך — אבל תגובתך כן."},{l:"טז",n:"המגדל",k:"זעזוע",m:"לפעמים ההרס הוא פינוי הקרקע לבנייה נכונה יותר."},{l:"יז",n:"הכוכב",k:"תקווה",m:"אחרי כל קריסה מגיע רגע של בהירות. הקשב לו."}];
const PROVERBS=["מעלה ומטה שתי אצבעות של אותה יד. נס אחד.","המס והצך. נמס, נקרש, ושוב נמס. האבן יושבת באמצע.","שלושים חישורים בטבור אחד. הגלגל נוסע על הריק שבאמצע."];
const STORIES=[{t:"בת המלך האבודה",b:"מעשה בבת מלך שיצאה מארמון אביה בלילה ולא חזרה. ימים רבים חיפש אותה המלך, והיא ישבה בבקתה אצל נהר רחוק ולא ידעה שהיא בת מלך. עד שיום אחד שמעה קול עולה מן המים: בתי, קומי ושובי.",l:"הריח שעל כף היד זוכר מה שהחלום שכח."},{t:"הגשר והנזיר",b:"נזיר עמד על גשר ושאל כל עובר: מאין באת ולאן אתה הולך? איש לא עצר. רק ילד אחד עצר ושאל: ואתה? מאין באת אתה? והנזיר חייך לראשונה מזה שנים.",l:"שאלה אחת כנה שווה אלף תשובות."}];
const $=id=>document.getElementById(id);
const now=new Date();const start=new Date(now.getFullYear(),0,0);const day=Math.floor((now-start)/864e5);const h=now.getHours();
$("opening").textContent=h<5?"הלילה. הזמן שבו הכל שקט.":h<10?"הבוקר עלה. מה אתה מבקש היום?":h<16?"היום בעיצומו. עצור לרגע.":h<20?"היום נסגר. מה נשאר?":"הלילה. הזמן שבו הכל שקט.";
$("closing").textContent=h<5?"הלילה שומר. מחר יבוא.":h<10?"היום נפתח. לך אליו.":h<16?"היום ממשיך. אבל אתה כבר לא אותו דבר.":h<20?"הערב יורד. קח איתך רק מה שצריך.":"הלילה שומר. מחר יבוא.";
$("dateline").textContent=now.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"});
const c=CARDS[day%CARDS.length];$("cardLetter").textContent=c.l;$("cardName").textContent=c.n;$("cardKeyword").textContent=c.k;$("cardMeaning").textContent=c.m;
$("whisper").textContent=PROVERBS[day%PROVERBS.length];
const ref=new Date(2000,0,6,18,14).getTime();const phase=((now-ref)/864e5%29.53)/29.53;
const moons=["","🌒","🌓","🌔","","🌖","","🌘"];$("moon").textContent=moons[Math.round(phase*8)%8];$("lunarGlyph").textContent=moons[Math.round(phase*8)%8];
$("lunarTheme").textContent=phase<.25?"זמן לזרוע. מה אתה רוצה שיתחיל?":phase<.5?"הדבר גדל. תן לו מקום.":phase<.75?"השיא. מה אתה רואה עכשיו?":"זמן לשחרר. מה כבר לא צריך?";
const m=now.getMonth()+1;const season=m>=3&&m<=5?["אביב","🌱","משהו חדש מתחיל. מה נולד?"]:m<=8?["קיץ","☀","הכל פורח. מה אתה עושה עם השפע?"]:m<=11?["סתיו","🍂","זמן לאסוף. מה הבשיל?"]:["חורף","❄","זמן לנוח. מה מחכה מתחת לפני השטח?"];
$("seasonGlyph").textContent=season[1];$("seasonLabel").textContent=season[0];$("seasonTheme").textContent=season[2];
const s=STORIES[day%STORIES.length];$("storyTitle").textContent=s.t;$("storyBody").textContent=s.b;$("storyTeaching").textContent=s.l;
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add("on")),{threshold:.15});
document.querySelectorAll("section").forEach(x=>io.observe(x));
</script>
</body>
</html>
